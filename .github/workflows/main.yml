
name: Daily Kids Video Automation

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '30 16 * * *'  # 10:00 PM IST
  workflow_dispatch:

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:
      - name: Start daily automation
        run: |
          echo "Hindi Kids Cartoon Studio started!"
          echo "Daily schedule: 10 AM and 10 PM IST"
          echo "10 AM: 1 Long Video + 1 Short"
          echo "10 PM: 1 Short"
