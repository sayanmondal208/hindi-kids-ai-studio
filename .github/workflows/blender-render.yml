name: Blender 3D Render Test

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and Graphics Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libxrender1 libxi6

      - name: Render 3D Rabbit Preview
        run: |
          blender --background --python blender_scene.py  --render-frame 1

      - name: Upload Rendered Frames
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-3d-render
          path: output/*.png
          if-no-files-found: warn
